name: Verify Human Identity
on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'aril888'
        required: true
        default: 'aril888'
      agent_description:
        description: 'aril888'
        required: true
        default: 'aril888 AI Agent'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Step 1 - Skip ClawHub (deprecated)
        run: echo "ClawHub step skipped"
      - name: Install script dependencies
        run: |
          cd scripts
          npm install
      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js
      - name: Step 3 - Link Human to Agent
        run: |
           node scripts/manualLinkHumanToAgent.js --challenge '{"name": "aril888", "description": "aril888 AI Agent"}'
